name: round-robin
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: round_robin
      POSTGRES_PASSWORD: round_robin_local
      POSTGRES_DB: round_robin
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U round_robin -d round_robin"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  redis-data:

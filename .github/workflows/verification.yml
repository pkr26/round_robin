name: Implementation verification
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      ROUND_ROBIN_PROFILE: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify --output test-results/offline-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evidence
          path: |
            test-results/
            playwright-report/
  services:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      ROUND_ROBIN_PROFILE: simulated
      ROUND_ROBIN_TEST_DATABASE_URL: postgresql+psycopg://round_robin:round_robin_local@127.0.0.1:55432/round_robin_test
      ROUND_ROBIN_TEST_BROKER_URL: redis://127.0.0.1:56379/14
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: round_robin
          POSTGRES_PASSWORD: round_robin_local
          POSTGRES_DB: round_robin_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U round_robin -d round_robin_test" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['56379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker build -t round-robin-native-renderer:local -f scripts/native-renderer.Dockerfile .
      - run: pnpm audit:full --output test-results/audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-evidence
          path: |
            test-results/
            playwright-report/
